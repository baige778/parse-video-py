services:
  parse-video-py:
    build:
      context: .
      args:
        # 国内构建加速（默认已内置清华/ npmmirror 镜像源，海外构建可显式覆盖为空）
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-https://cdn.npmmirror.com/binaries/playwright}
        # 默认安装无头 Chromium（抖音扫码登录 + 浏览器兜底依赖）
        INSTALL_BROWSER: ${INSTALL_BROWSER:-1}
    container_name: parse-video-py
    ports:
      - "8000:8000"
    environment:
      # 抖音登录态 / 二维码数据目录，容器内持久化浏览器 profile 位于 /data/browser_profile
      - DOUYIN_DATA_DIR=/data
      # Web 服务 Basic Auth（可选）
      # - PARSE_VIDEO_USERNAME=admin
      # - PARSE_VIDEO_PASSWORD=change-me
    volumes:
      - ./data:/data
    restart: unless-stopped
